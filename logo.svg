<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 275 275" width="500" height="500">
    <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF0000" />
            <stop offset="33%" stop-color="#FFA500" />
            <stop offset="66%" stop-color="#800080" />
            <stop offset="100%" stop-color="#FFFF00" />
        </linearGradient>

        <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#87CEEB" />
            <stop offset="33%" stop-color="#00008B" />
            <stop offset="66%" stop-color="#800080" />
            <stop offset="100%" stop-color="#008000" />
        </linearGradient>

        <linearGradient id="grad3" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FF1493" />
            <stop offset="100%" stop-color="#FF4500" />
        </linearGradient>
    </defs>

    <!-- Outer 'C' -->
    <path d="M 211.75 211.75 A 105 105 0 1 1 211.75 63.25" fill="none" stroke="url(#grad1)"
          stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 1st Added 'C' (Rotated 45°) -->
    <path d="M 137.50 217.50 A 80 80 0 1 1 217.50 137.50" fill="none" stroke="url(#grad2)"
          stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 2nd Added 'C' (Rotated 90°) -->
    <path d="M 98.61 176.39 A 55 55 0 1 1 176.39 176.39" fill="none" stroke="url(#grad3)"
          stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Innermost 'C' (Rotated 135°) -->
    <path d="M 107.50 137.50 A 30 30 0 1 1 137.50 167.50" fill="none" stroke="url(#grad1)"
          stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
</svg>